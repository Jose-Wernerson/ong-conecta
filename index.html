<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONG Conecta</title>
  <meta name="description" content="ONG Conecta: divulgue projetos, faça doações e seja voluntário.">
  <link rel="icon" type="image/svg+xml" href="/imagens/logo/logo-icone.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap">
  <script>
    /* Aplica classe .js e o tema salvo antes da primeira renderização (evita flash) */
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var p = JSON.parse(localStorage.getItem('ong:preferencias') || '{}');
        if (p.tema) d.setAttribute('data-theme', p.tema);
      } catch (e) { /* sem localStorage */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <header class="site-header">
    <a class="brand" href="#/">
      <img src="/imagens/logo/logo.svg" width="190" height="40" alt="ONG Conecta">
    </a>
    <div class="theme-switch" role="group" aria-label="Tema da página">
      <button type="button" class="btn btn--outline btn--sm" data-action="set-theme" data-theme-value="light" aria-pressed="true">Claro</button>
      <button type="button" class="btn btn--outline btn--sm" data-action="set-theme" data-theme-value="dark" aria-pressed="false">Escuro</button>
      <button type="button" class="btn btn--outline btn--sm" data-action="set-theme" data-theme-value="contrast" aria-pressed="false">Contraste</button>
    </div>
    <button type="button" class="menu-toggle" data-action="toggle-menu" aria-expanded="false" aria-controls="menu-principal">
      <span class="menu-toggle__bars" aria-hidden="true"></span>
      <span class="sr-only">Abrir menu</span>
    </button>
    <nav id="menu-principal" class="nav" aria-label="Menu principal">
      <ul class="menu">
        <li><a href="#/">Início</a></li>
        <li><a href="#/projetos">Projetos</a></li>
        <li class="has-sub">
          <a href="#/cadastro">Participe</a>
          <ul class="submenu">
            <li><a href="#/cadastro">Seja voluntário</a></li>
            <li><a href="#/doacao">Faça uma doação</a></li>
          </ul>
        </li>
        <li><a href="#/transparencia">Transparência</a></li>
        <li><a href="#/meus-cadastros">Meus cadastros</a></li>
      </ul>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <noscript>
      <div class="alert alert--error noscript-aviso">
        <p>Esta aplicação precisa de JavaScript. Use as <a href="html/projetos.html">páginas simples de projetos</a>,
          <a href="html/cadastro.html">cadastro</a> e <a href="html/doacao.html">doação</a>.</p>
      </div>
    </noscript>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 ONG Conecta. Projeto acadêmico de José Wernerson.</p>
    <p><a href="https://www.linkedin.com/in/jose-wernerson">LinkedIn</a></p>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>
</body>
</html>
