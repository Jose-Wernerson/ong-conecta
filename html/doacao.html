<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doação | ONG Conecta</title>
  <meta name="description" content="Faça uma doação para os projetos da ONG Conecta.">
  <link rel="icon" type="image/svg+xml" href="../public/imagens/logo/logo-icone.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>
  <header class="site-header">
    <a class="brand" href="../index.html">
      <img src="../public/imagens/logo/logo.svg" width="160" height="40" alt="ONG Conecta">
    </a>
    <nav id="menu-principal" class="nav" aria-label="Menu principal">
      <ul class="menu">
        <li><a href="../index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li class="has-sub">
          <a href="cadastro.html">Participe</a>
          <ul class="submenu">
            <li><a href="cadastro.html">Seja voluntário</a></li>
            <li><a href="doacao.html" aria-current="page">Faça uma doação</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <h1>Faça uma doação</h1>
    <p>Qualquer valor ajuda. Doação mínima de R$ 5,00.</p>
    <form action="#" method="post">
      <fieldset>
        <legend>Dados da doação</legend>
        <p><label for="nome">Nome</label><br>
        <input type="text" id="nome" name="nome" required autocomplete="name"></p>
        <p><label for="email">E-mail</label><br>
        <input type="email" id="email" name="email" required autocomplete="email"></p>
        <p><label for="valor">Valor (R$)</label><br>
        <input type="number" id="valor" name="valor" required min="5" step="0.01" inputmode="decimal"></p>
        <p><label for="projeto">Projeto</label><br>
        <select id="projeto" name="projeto" required>
          <option value="">Selecione…</option>
          <option value="educacao">Semear Saber (Educação)</option>
          <option value="alimentacao">Mesa Cheia (Alimentação)</option>
          <option value="saude">Saúde na Praça (Saúde)</option>
        </select></p>
      </fieldset>
      <fieldset>
        <legend>Forma de pagamento</legend>
        <p><label><input type="radio" name="pagamento" value="pix" required> Pix</label></p>
        <p><label><input type="radio" name="pagamento" value="cartao"> Cartão de crédito</label></p>
        <p><label><input type="radio" name="pagamento" value="boleto"> Boleto</label></p>
      </fieldset>
      <p><button class="btn" type="submit">Confirmar doação</button></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 ONG Conecta. Projeto acadêmico de José Wernerson.</p>
    <p><a href="https://www.linkedin.com/in/jose-wernerson">LinkedIn</a></p>
  </footer>
</body>
</html>
